name: Compilar APK de Kivy
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar herramientas de compilacion completas
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool libltdl-dev pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake ccache
          pip install --upgrade pip
          pip install "buildozer>=1.5.0" "cython<3.0.0"

      - name: Inicializar y Configurar Buildozer
        run: |
          buildozer init
          # Ajustes críticos para evitar caídas por falta de memoria y timeout
          sed -i 's/#android.ndk_api = 21/android.ndk_api = 21/g' buildozer.spec
          sed -i 's/android.api = 33/android.api = 33/g' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3==3.11.1,kivy/g' buildozer.spec
          
          # TRUCO DE VELOCIDAD: Compilar solo para celulares modernos (64 bits) corta el tiempo a la mitad
          sed -i 's/android.archs = arm64-v8a, armeabi-v7a/android.archs = arm64-v8a/g' buildozer.spec
          
          # Desactivar la compilación recursiva inútil que satura el servidor
          sed -i 's/# android.no-byte-compile-python = False/android.no-byte-compile-python = True/g' buildozer.spec

      - name: Compilar APK Optimizada
        run: |
          unset ANDROID_NDK
          unset ANDROID_NDK_HOME
          unset ANDROID_NDK_ROOT
          unset ANDROID_NDK_LATEST_HOME
          yes | buildozer -v android debug

      - name: Subir APK Resultante
        uses: actions/upload-artifact@v4
        with:
          name: m3
          path: bin/*.apk
