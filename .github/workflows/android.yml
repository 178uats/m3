name: Compilar APK de Kivy
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Python del Servidor
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar herramientas de compilacion completas
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool libltdl-dev pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake ccache wget
          pip install --upgrade pip
          pip install "buildozer>=1.5.0" "cython<3.0.0"

      - name: Descargar e Instalar NDK r25c Oficial Manualmente
        run: |
          wget "https://google.com" -O ndk.zip
          unzip -q ndk.zip -d $HOME/
          rm ndk.zip

      - name: Inicializar y Configurar Buildozer con Rutas Absolutas
        run: |
          buildozer init
          # Forzamos los valores del NDK inyectando la ruta de la carpeta que descargamos recién
          sed -i "s|#android.ndk_path =|android.ndk_path = $HOME/android-ndk-r25c|g" buildozer.spec
          sed -i 's/#android.ndk = 25c/android.ndk = 25c/g' buildozer.spec
          sed -i 's/#android.ndk_api = 21/android.ndk_api = 21/g' buildozer.spec
          sed -i 's/android.api = 33/android.api = 33/g' buildozer.spec
          
          # Resto de ajustes óptimos de velocidad
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy/g' buildozer.spec
          sed -i 's/android.archs = arm64-v8a, armeabi-v7a/android.archs = arm64-v8a/g' buildozer.spec
          sed -i 's/# android.no-byte-compile-python = False/android.no-byte-compile-python = True/g' buildozer.spec

      - name: Compilar APK Forzando el NDK Correcto
        run: |
          # Le declaramos la variable de entorno directo al compilador para que no use otra cosa
          export ANDROID_NDK_HOME=$HOME/android-ndk-r25c
          export ANDROID_NDK_ROOT=$HOME/android-ndk-r25c
          yes | buildozer android debug

      - name: Subir APK Resultante
        uses: actions/upload-artifact@v4
        with:
          name: m3
          path: bin/*.apk
