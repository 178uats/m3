name: Compilar APK de Kivy
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar herramientas de compilacion completas
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool libltdl-dev pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake
          pip install --upgrade pip
          pip install buildozer cython

      - name: Inicializar y Configurar Buildozer
        run: |
          buildozer init
          # Ajustes para asegurar compatibilidad de Kivy y Android en GitHub
          sed -i 's/#android.ndk_api = 21/android.ndk_api = 21/g' buildozer.spec
          sed -i 's/android.api = 33/android.api = 33/g' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy/g' buildozer.spec

      - name: Compilar APK limpiando variables de entorno conflictivas
        run: |
          # Borramos las variables preconfiguradas de GitHub para evitar conflictos de rutas
          unset ANDROID_NDK
          unset ANDROID_NDK_HOME
          unset ANDROID_NDK_ROOT
          unset ANDROID_NDK_LATEST_HOME
          yes | buildozer -v android debug

      - name: Subir APK Resultante
        uses: actions/upload-artifact@v4
        with:
          name: m3
          path: bin/*.apk
